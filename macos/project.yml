name: Kaluta
options:
  bundleIdPrefix: org.kaluta
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # Pinned by revision (spec §16 supply chain): Sparkle 2.10.0.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only: the Rust core is built for aarch64 (spec §14.1).
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    KALUTA_ENTITLEMENTS: Kaluta/Resources/Kaluta.entitlements
    # Rust core artifacts written by scripts/build-core.sh (spec §4.1).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../build/core/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/core/lib
targets:
  KalutaCore:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: framework.static
    platform: macOS
    sources:
      - path: ../build/core/swift/kaluta_core.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false   # always run; cargo decides what to rebuild
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/../build/core/swift/kaluta_core.swift
          - $(SRCROOT)/../build/core/include/kaluta_coreFFI.h
          - $(SRCROOT)/../build/core/include/module.modulemap
          - $(SRCROOT)/../build/core/lib/libkaluta_core.a
          - $(SRCROOT)/../build/core/bin/kaluta-mcp
    settings:
      base:
        # The script writes outside the build directory and runs cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: org.kaluta.Kaluta.core
        PRODUCT_NAME: KalutaCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Generated code predates strict concurrency; keep it quiet here only.
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  Kaluta:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: application
    platform: macOS
    sources:
      - path: Kaluta
    dependencies:
      - target: KalutaCore
      - package: Sparkle
    postCompileScripts:
      - name: Embed kaluta-mcp
        # Agent CLIs spawn <app>/Contents/MacOS/kaluta-mcp (spec §10.1).
        script: |
          install -m 0755 "$SRCROOT/../build/core/bin/kaluta-mcp" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/kaluta-mcp"
        inputFiles:
          - $(SRCROOT)/../build/core/bin/kaluta-mcp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/kaluta-mcp
    info:
      path: Kaluta/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compares this; release.yml sets it to the build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle (spec §16). One appcast on main lists every release; betas
        # carry the "beta" channel (scripts/make-appcast.sh).
        SUFeedURL: https://raw.githubusercontent.com/audiojak/kaluta/main/appcast.xml
        # Set by the release maintainer (docs/releasing.md). Empty disables
        # the updater, so development builds never check for updates.
        SUPublicEDKey: 7MkOQ+3AXyPMrh8zri1P40oRXY3+8FAui3b/B5xBcfE=
        SUEnableInstallerLauncherService: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kaluta.Kaluta
        PRODUCT_NAME: Kaluta
        OTHER_LDFLAGS: -lkaluta_core
        ENABLE_HARDENED_RUNTIME: YES
        # Indirect so Local.xcconfig (dev signing) can swap the file.
        CODE_SIGN_ENTITLEMENTS: $(KALUTA_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Kaluta/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Kaluta
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Actual AI and the Kaluta contributors. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KalutaTests:
    # Debug builds may sign with a stable development identity
    # (scripts/dev-signing.sh); Local.xcconfig is gitignored and may be empty.
    configFiles:
      Debug: Local.xcconfig
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KalutaTests
    dependencies:
      - target: Kaluta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kaluta.Kaluta.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kaluta.app/Contents/MacOS/Kaluta"
schemes:
  Kaluta:
    build:
      targets:
        Kaluta: all
        KalutaTests: [test]
    test:
      targets:
        - KalutaTests
      gatherCoverageData: false
