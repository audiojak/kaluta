[package]
name = "provider-agentmail"
description = "AgentMail (agentmail.to) agent mailboxes: sign-up, verification, inboxes and a REST mail provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A local fake of AgentMail's WebSocket for tests (`ws_fake`).
fake-ws = []

[dependencies]
mail-domain.workspace = true
mail-mime.workspace = true
provider-api.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "sync", "net", "macros", "rt"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
