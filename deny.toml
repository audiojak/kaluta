# cargo-deny configuration. Run: cargo deny check

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # basic-toml is archived (unmaintained, no successor release). It reaches
  # Kaluta only at build time, through uniffi_bindgen's askama templates;
  # it never runs in the app or reads mail. Drop this when uniffi moves off
  # it. Accepted 2026-10-20.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen; no maintained release" },
  # pin-utils is archived (unmaintained, no successor release; no known
  # vulnerability). It reaches Kaluta through async-imap's pinning macros,
  # used by the IMAP backfill. Drop this when async-imap moves off it.
  # Accepted 2026-11-09.
  { id = "RUSTSEC-2026-0441", reason = "unmaintained, no vulnerability; via async-imap, no maintained release" },
  # chrono is declared unmaintained (no known vulnerability; every version
  # is affected, so there is nothing to upgrade to). Kaluta uses it for
  # calendar and schedule arithmetic, and it also arrives through
  # async-imap, rrule, chrono-tz and rmcp, so moving Kaluta's own code off
  # it would not remove it. Drop this when those crates move to jiff or
  # time, and move Kaluta's own uses with them. Accepted 2026-11-17.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; also required by async-imap, rrule, chrono-tz and rmcp" },
  # chrono-tz (time zones for chrono) is declared unmaintained with it: no
  # known vulnerability, no version to upgrade to. Kaluta and provider-gcal
  # use it for calendar time zones, and rrule requires it. It goes when
  # chrono goes. Accepted 2026-11-17.
  { id = "RUSTSEC-2026-0555", reason = "unmaintained, no vulnerability; goes with chrono, also required by rrule" },
]

[licenses]
version = 2
# Kaluta is MIT; dependencies must be compatible with MIT distribution.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
