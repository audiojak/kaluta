[package]
name = "rules-server"
description = "openagc-rules: serves agent mailboxes' published writing guides and shared facts to cloud agents over MCP and a small REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "openagc-rules"
path = "src/main.rs"

[dependencies]
writing-guide.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
http.workspace = true
pulldown-cmark.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
agent-mcp.workspace = true
mail-mime.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
